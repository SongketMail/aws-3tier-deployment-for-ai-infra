name: Generate Page PDF

on:
  push:
    branches: ["main"]

jobs:
  build-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Markdown Front Matter
        run: |
          chmod +x scripts/prepare_docs.py
          python scripts/prepare_docs.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate PDF
        run: node scripts/generate_pdf.js

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-pdf
          path: ./docs/assets/output.pdf

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/output.pdf
          git diff-index --quiet HEAD || (git commit -m "chore: update generated PDF" && git push)
