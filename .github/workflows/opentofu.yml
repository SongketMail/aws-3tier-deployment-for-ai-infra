name: "OpenTofu CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC connection to AWS
  contents: read

jobs:
  opentofu-lint-and-validate:
    name: "OpenTofu Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Init
        run: |
          cd terraform
          tofu init -backend=false

      - name: OpenTofu Validate
        run: |
          cd terraform
          tofu validate

  check-secrets:
    name: "Check Secrets Availability"
    runs-on: ubuntu-latest
    outputs:
      has-aws-role: ${{ steps.check.outputs.has-aws-role }}
    steps:
      - name: Check if AWS_ROLE_TO_ASSUME is set
        id: check
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "has-aws-role=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-aws-role=false" >> "$GITHUB_OUTPUT"
          fi

  opentofu-plan:
    name: "OpenTofu Plan"
    runs-on: ubuntu-latest
    needs: [opentofu-lint-and-validate, check-secrets]
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has-aws-role == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        run: |
          cd terraform
          tofu init

      - name: OpenTofu Plan
        run: |
          cd terraform
          tofu plan -no-color

  opentofu-apply:
    name: "OpenTofu Apply"
    runs-on: ubuntu-latest
    needs: [opentofu-lint-and-validate, check-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-secrets.outputs.has-aws-role == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.2"

      - name: OpenTofu Init
        run: |
          cd terraform
          tofu init

      - name: OpenTofu Apply
        run: |
          cd terraform
          tofu apply -auto-approve
